spring.application.name=CRUDdemo

# Use environment variables instead of hardcoded values
spring.datasource.url=${DB_URL:jdbc:mysql://3.90.235.232:3306/employee_directory}
spring.datasource.username=${DB_USER:springstudent}
spring.datasource.password=${DB_PASS:springstudent}

# Connection pool settings (critical for Jenkins)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=200000

# JDBC driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
